<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber_Watch - Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">CYBER_<span>WATCH</span></div>
      <div class="userbox">
        <span id="userInfo">> loading...</span>
        <button id="logoutBtn" class="btn small">LOGOUT</button>
      </div>
    </header>

    <main class="grid">
      <div class="card">
        <div class="label">DEVICES</div>
        <div class="value" id="cardDevices">-</div>
      </div>
      <div class="card">
        <div class="label">LAST SCAN</div>
        <div class="value small" id="cardLastScan">-</div>
      </div>
      <div class="card">
        <div class="label">PUBLIC IP</div>
        <div class="value small" id="cardPublicIp">-</div>
      </div>
      <div class="card">
        <div class="label">AGENT</div>
        <div class="value" id="cardAgent">-</div>
      </div>
    </main>

    <script src="/static/dashboard.js?v=2"></script>
  </body>
</html>
